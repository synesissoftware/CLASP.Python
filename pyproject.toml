[build-system]
build-backend = "setuptools.build_meta"
requires = [
	"setuptools>=61.0",
]


[project]
authors = [
	{ email = "matthew@synesis.com.au", name = "Matt Wilson" },
]
classifiers = [
	"Intended Audience :: Developers",
	"License :: OSI Approved :: BSD License",
	"Natural Language :: English",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 2",
	"Programming Language :: Python :: 2.7",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]
dependencies = [
]
description = "Command-Line Argument Sorting and Parsing, for Python"
keywords = [
	"cli",
	"command-line",
	"parsing",
]
license = { text = "BSD-3-Clause" }
name = "pyclasp"
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*, !=3.6.*, !=3.7.*"
version = "0.8.13"

[project.urls]
"Bug Tracker" = "https://github.com/synesissoftware/CLASP.Python/issues"
Changelog = "https://github.com/synesissoftware/CLASP.Python/blob/master/CHANGES.md"
Homepage = "https://github.com/synesissoftware/CLASP.Python"
Repository = "https://github.com/synesissoftware/CLASP.Python"

[project.optional-dependencies]
dev = [
	"pytest",
	"ruff>=0.4.0",
]


[tool.ruff]
line-length = 76
target-version = "py38"

[tool.ruff.lint]
ignore = [
	"E501",
]
select = [
	"E",
	"F",
]

[tool.setuptools.packages.find]
exclude = [
	"examples*",
	"tests*",
]
include = [
	"pyclasp",
	"pyclasp.*",
]
